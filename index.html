<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
    <!-- Basic SEO -->
    <title>Xi Wei @ HKU | Urban Planning and Mobility Research</title>
    <meta
      name="description"
      content="Xi Wei is a PhD student in Urban Planning, focusing on intercity mobility, activity spaces, social segregation, and urban spatial restructuring in Chinese urban agglomerations."
    />
    <meta
      name="keywords"
      content="Xi Wei, HKU, Urban Planning, Intercity Mobility, Activity Space, Urban Geography, Transport Geography, Social Segregation"
    />
    <meta name="author" content="Xi Wei" />
  
    <!-- Canonical URL: 改成你的真实 GitHub Pages 地址 -->
    <link rel="canonical" href="https://xiweihku.github.io/" />
  
    <!-- Open Graph: 用于微信、LinkedIn、Facebook 等分享预览 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Xi Wei @ HKU | Urban Planning and Mobility Research" />
    <meta
      property="og:description"
      content="Academic website of Xi Wei, featuring research on intercity mobility, activity spaces, social segregation, and urban spatial restructuring."
    />
    <meta property="og:url" content="https://xiweihku.github.io/" />
    <meta property="og:site_name" content="Xi Wei Academic Website" />
  
    <!-- Twitter / X Preview -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Xi Wei @ HKU | Urban Planning and Mobility Research" />
    <meta
      name="twitter:description"
      content="Academic website of Xi Wei, focusing on intercity mobility, activity spaces, and urban spatial restructuring."
    />
  
    <!-- Favicon: 如果你有头像或图标，可以放在 public/favicon.png -->
    <link rel="icon" type="image/png" href="/favicon.png" />
  
    <!-- Structured data: 帮助搜索引擎理解网站名称 -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Xi Wei Academic Website",
        "alternateName": "Xi Wei @ HKU",
        "url": "https://xiweihku.github.io/"
      }
    </script>
  </head>

  <body class="bg-neutral-50">
    <div id="root"></div>

    <!-- Hidden visitor tracker -->
    <div
      style="
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        opacity: 0;
        pointer-events: none;
      "
      aria-hidden="true"
    >
      <script
        type="text/javascript"
        id="mapmyvisitors"
        src="https://mapmyvisitors.com/map.js?d=5dhTElcaZCp5JebjA6LrQM4n3FHSkwsWcDcWtNQnuTk&cl=ffffff&w=a">
      </script>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
